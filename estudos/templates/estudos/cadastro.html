{% extends 'estudos/base.html' %}

{% block title %}Criar Conta | Gerenciador de Estudos{% endblock %}

{% block content %}
<div class="mx-auto mt-4" style="max-width: 450px;">
    <div class="card border-0 shadow-lg rounded-4 p-4 bg-white">
        <h3 class="fw-bold text-center text-primary mb-3">Criar Conta</h3>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 fw-bold mt-2">Cadastrar</button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">Já possui conta? <a href="{% url 'login' %}">Faça login</a></small>
        </div>
    </div>
</div>
{% endblock %}
