{% extends 'estudos/base.html' %}

{% block title %}Editar Sessão | Gerenciador de Estudos{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 500px;">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-4">
            <h4 class="card-title mb-3">Editar Sessão de Estudo</h4>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Matéria</label>
                    <input type="text" name="materia" class="form-control" value="{{ sessao.materia }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Duração (minutos)</label>
                    <input type="number" name="duracao_minutos" class="form-control" value="{{ sessao.duracao_minutos }}" min="1" required>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning flex-grow-1">Salvar Alterações</button>
                    <a href="{% url 'home' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
