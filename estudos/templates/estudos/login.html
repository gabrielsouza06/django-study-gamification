{% extends 'estudos/base.html' %}

{% block title %}Login | Gerenciador de Estudos{% endblock %}

{% block content %}
<div class="mx-auto mt-5" style="max-width: 400px;">
    <div class="card border-0 shadow-lg rounded-4 p-4 bg-white">
        <h3 class="fw-bold text-center text-primary mb-3">Entrar no Sistema</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuário</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></small>
        </div>
    </div>
</div>
{% endblock %}
